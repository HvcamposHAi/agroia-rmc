name: Coleta CEASA/PR (preços por variedade)

# Cotação diária da CEASA/PR por variedade (chat/ceasa_pr_collector.py → ceasa_pr_cotacoes).
# Complementa o PROHORT (prohort.yml), que não tem variedades. Workflow separado para que
# uma falha aqui nunca afete a coleta PROHORT. A CEASA publica a cotação a partir das 10h.
# Se o servidor celepar7.pr.gov.br recusar IPs de datacenter (como o portal de licitações),
# trocar runs-on para self-hosted (mesmo runner de coleta.yml).

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Dias para coletar (backfill)"
        default: "7"
      inicio:
        description: "Carga retroativa: data inicial AAAA-MM-DD (vazio = usar 'dias')"
        default: ""
      fim:
        description: "Carga retroativa: data final AAAA-MM-DD (vazio = hoje)"
        default: ""
  schedule:
    - cron: "30 16 * * 1-6"   # 16:30 UTC = 13:30 BRT, seg–sáb

concurrency:
  group: ceasa-pr
  cancel-in-progress: false

jobs:
  coleta-ceasa-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx supabase==2.28.3 python-dotenv

      - name: Coletar cotações por variedade
        env:
          DIAS: ${{ github.event.inputs.dias || '7' }}
          INICIO: ${{ github.event.inputs.inicio }}
          FIM: ${{ github.event.inputs.fim }}
        run: |
          ARGS="$DIAS"
          if [ -n "$INICIO" ]; then ARGS="$ARGS --inicio $INICIO"; fi
          if [ -n "$FIM" ]; then ARGS="$ARGS --fim $FIM"; fi
          python -m chat.ceasa_pr_collector $ARGS
