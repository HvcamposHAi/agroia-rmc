name: Coleta de Dados (AgroIA-RMC)

# Coleta de licitações do FAAC (SMSAN/FAAC) no PORTAL DA TRANSPARÊNCIA de Curitiba
# (coleta_transparencia.py — HTTP puro, sem navegador).
#
# Roda num runner SELF-HOSTED (máquina do usuário, Windows, rede BR). Motivo: os
# portais da Prefeitura RECUSAM IPs de datacenter — confirmado em 24/09/2026: do
# ubuntu-latest (Azure) o Portal da Transparência aceita a conexão mas nunca responde
# (4× read timeout de 120 s), enquanto da rede do usuário responde HTTP 200 em <1 s.
# (O portal JSF antigo, consultalicitacao...:9090, tinha o mesmo bloqueio e foi
# desativado pela Prefeitura em 2026.)
#
# Se o PC estiver desligado às 06:00, o job fica na fila (até 24 h) e roda assim que
# o runner voltar. Para o runner subir sozinho no boot: scripts/setup-runner-autostart.ps1.

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos (ex.: 2026 | 2025,2026 | 2019-2026). Vazio = ano anterior + corrente"
        required: false
  schedule:
    - cron: "0 9 * * *"   # todos os dias 09:00 UTC = 06:00 BRT

# Evita coletas sobrepostas (disparo manual + agendada)
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: self-hosted
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Evita UnicodeEncodeError nos print() no console Windows (cp1252).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      COLETA_ORIGEM: ${{ github.event_name == 'schedule' && 'agendada' || 'manual' }}
    steps:
      - uses: actions/checkout@v4

      # Python 3.11 (wheels de lxml disponíveis); o setup-python baixa na 1ª vez.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4==4.12.2 lxml supabase==2.28.3 python-dotenv==1.0.0

      - name: Rodar coleta
        env:
          IN_ANOS: ${{ github.event.inputs.anos }}
        run: |
          $cmd = @('coleta_transparencia.py')
          if ($env:IN_ANOS) { $cmd += @('--anos', $env:IN_ANOS) }
          Write-Host "Executando: python $($cmd -join ' ')"
          python @cmd
          exit $LASTEXITCODE
