name: Coleta de Dados (AgroIA-RMC)

# O portal de Curitiba NÃO existe no DNS público (só resolve na rede do usuário),
# então a coleta roda num SELF-HOSTED RUNNER instalado na máquina do usuário (Windows).
# O botão "Buscar Dados" dispara este workflow (workflow_dispatch via API); o runner
# local executa o etapa2, que grava progresso em coleta_status e o resumo em coleta_execucoes.
# Setup do runner: repo → Settings → Actions → Runners → New self-hosted runner (Windows).

on:
  workflow_dispatch:
    inputs:
      dt_inicio:
        description: "Data inicial DD/MM/AAAA (vazio = a partir da última coletada)"
        required: false
      dt_fim:
        description: "Data final DD/MM/AAAA (vazio = hoje)"
        required: false
  schedule:
    - cron: "0 9 * * 1"   # toda segunda 09:00 UTC = 06:00 BRT (PC precisa estar ligado)

# Evita coletas sobrepostas
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: self-hosted          # runner na máquina do usuário (Windows)
    timeout-minutes: 350
    defaults:
      run:
        shell: powershell
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_SLOW_MO: "60"
      # Evita UnicodeEncodeError nos print() com "→" no console Windows (cp1252).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      # Usa Python 3.11 (tem wheels p/ lxml==4.9.3/greenlet; o 3.13 da máquina exigiria
      # compilar com MSVC). O setup-python baixa o 3.11 no runner na 1ª vez.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Idempotente: instala as deps nesse Python 3.11 (wheels, rápido). No Windows o
      # Chromium do Playwright instala sem --with-deps.
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.40.0 beautifulsoup4==4.12.2 lxml==4.9.3 supabase==2.28.3 python-dotenv==1.0.0
          python -m playwright install chromium

      - name: Rodar coleta
        env:
          IN_INI: ${{ github.event.inputs.dt_inicio }}
          IN_FIM: ${{ github.event.inputs.dt_fim }}
        run: |
          $cmd = @('etapa2_itens_v9.py','--progress-file','coleta_status.json')
          if ($env:IN_INI) { $cmd += @('--dt-inicio', $env:IN_INI) }
          if ($env:IN_FIM) { $cmd += @('--dt-fim', $env:IN_FIM) }
          Write-Host "Executando: python $($cmd -join ' ')"
          python @cmd
          exit $LASTEXITCODE
