name: Coleta de Dados (AgroIA-RMC)

# Coleta de licitações do FAAC (SMSAN/FAAC) no PORTAL DA TRANSPARÊNCIA de Curitiba
# (coleta_transparencia.py — HTTP puro, sem navegador).
#
# Histórico: até jun/2026 a coleta usava o portal JSF consultalicitacao.curitiba.pr.gov.br:9090
# (Playwright num runner self-hosted, pois o portal recusava IPs de datacenter). Esse
# portal foi DESATIVADO pela Prefeitura (DNS NXDOMAIN, set/2026). O Portal da
# Transparência consulta o mesmo sistema (SGP), aceita IPs de datacenter e não exige
# navegador → roda no runner GRATUITO ubuntu-latest: não depende de nenhum PC ligado.
# O coletor antigo (etapa2_itens_v9.py) fica só como legado/referência.

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos (ex.: 2026 | 2025,2026 | 2019-2026). Vazio = ano anterior + corrente"
        required: false
  schedule:
    - cron: "0 9 * * *"   # todos os dias 09:00 UTC = 06:00 BRT

# Evita coletas sobrepostas (disparo manual + agendada)
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PYTHONUTF8: "1"
      COLETA_ORIGEM: ${{ github.event_name == 'schedule' && 'agendada' || 'manual' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4==4.12.2 lxml supabase==2.28.3 python-dotenv==1.0.0

      - name: Rodar coleta
        env:
          IN_ANOS: ${{ github.event.inputs.anos }}
        run: |
          if [ -n "$IN_ANOS" ]; then
            python coleta_transparencia.py --anos "$IN_ANOS"
          else
            python coleta_transparencia.py
          fi
