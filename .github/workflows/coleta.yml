name: Coleta de Dados (AgroIA-RMC)

# A coleta de licitações roda no runner GRATUITO ubuntu-latest (igual ao prohort.yml) —
# NÃO depende da máquina do usuário estar ligada.
#
# Histórico: antes usava self-hosted por se acreditar que o portal de Curitiba só
# resolvia na rede do usuário. ISSO ESTAVA DESATUALIZADO: o DNS público (8.8.8.8 /
# 1.1.1.1) resolve consultalicitacao.curitiba.pr.gov.br → 177.125.178.158 (IP público).
# A migração foi validada pelo workflow "coleta-probe.yml" (Actions → Run workflow):
# o portal responde e o Chromium hospedado carrega a home. Se algum dia a Prefeitura
# passar a bloquear IPs hospedados (Azure), o probe falha → reverter para self-hosted
# (runs-on: self-hosted + shell powershell). Ver sql/ e api/coleta.py (auto-cura) — um
# job que não conclui é marcado como timeout/erro auditado, sem travar a tela.

on:
  workflow_dispatch:
    inputs:
      dt_inicio:
        description: "Data inicial DD/MM/AAAA (vazio = a partir da última coletada)"
        required: false
      dt_fim:
        description: "Data final DD/MM/AAAA (vazio = hoje)"
        required: false
  schedule:
    - cron: "0 9 * * 1"   # toda segunda 09:00 UTC = 06:00 BRT

# Evita coletas sobrepostas
concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_SLOW_MO: "60"
    steps:
      - uses: actions/checkout@v4

      # Python 3.11 tem wheels p/ lxml==4.9.3/greenlet (evita compilar).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No Linux o Chromium do Playwright precisa das libs do SO (--with-deps).
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.40.0 beautifulsoup4==4.12.2 lxml==4.9.3 supabase==2.28.3 python-dotenv==1.0.0
          python -m playwright install --with-deps chromium

      - name: Rodar coleta
        env:
          IN_INI: ${{ github.event.inputs.dt_inicio }}
          IN_FIM: ${{ github.event.inputs.dt_fim }}
        run: |
          args=(etapa2_itens_v9.py --progress-file coleta_status.json)
          if [ -n "$IN_INI" ]; then args+=(--dt-inicio "$IN_INI"); fi
          if [ -n "$IN_FIM" ]; then args+=(--dt-fim "$IN_FIM"); fi
          echo "Executando: python ${args[*]}"
          python "${args[@]}"
