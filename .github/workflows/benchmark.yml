name: Benchmark de Motores LLM (AgroIA-RMC)

# Roda o benchmark de motores LLM num runner do GitHub Actions (rede de datacenter
# = latência estável p/ a medição), SEM tocar o serviço de produção no Render.
# Resultados sobem como artifact e (opcional) o resultados.json é commitado p/ o
# Cloudflare reconstruir e popular a página /benchmark.

on:
  workflow_dispatch:
    inputs:
      motores:
        description: "Motores (CSV) — claude,groq_llama,maritaca,gemini ou all"
        required: true
        default: "claude,groq_llama,gemini"
      reps:
        description: "Repetições por pergunta"
        required: true
        default: "3"
      perguntas:
        description: "all | A | B | preco|licitacao|edital|geral | P01,L02,..."
        required: true
        default: "all"
      commit_resultado:
        description: "Commitar resultados.json no repo (Cloudflare reconstrói a página)"
        type: boolean
        default: true

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write          # necessário p/ commitar o resultados.json de volta
    env:
      # Supabase — executar_tool consulta o banco (igual à produção)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Chaves dos motores
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MARITACA_API_KEY: ${{ secrets.MARITACA_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      MARITACA_MODELO: ${{ vars.MARITACA_MODELO || 'sabia-4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements_benchmark.txt

      - name: Instalar dependências do benchmark
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_benchmark.txt

      - name: Rodar benchmark
        run: |
          python -m benchmark.benchmark_executor \
            --motores "${{ github.event.inputs.motores }}" \
            --reps "${{ github.event.inputs.reps }}" \
            --perguntas "${{ github.event.inputs.perguntas }}" \
            --out metrics

      - name: Exportar resultados p/ o front
        run: python -m benchmark.benchmark_executor --export-frontend --out metrics

      - name: Subir métricas como artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-metrics-${{ github.run_id }}
          path: |
            metrics/benchmark_runs_*.csv
            metrics/benchmark_resumo_*.json
            agroia-frontend/public/benchmark/resultados.json
          if-no-files-found: warn

      - name: Commitar resultados.json (Cloudflare reconstrói /benchmark)
        if: ${{ github.event.inputs.commit_resultado == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agroia-frontend/public/benchmark/resultados.json
          if git diff --staged --quiet; then
            echo "Nada a commitar (resultados.json inalterado)."
          else
            git commit -m "chore(benchmark): atualiza resultados [skip ci]"
            git push
          fi
